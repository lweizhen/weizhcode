[project]
name = "weizhcode"
version = "0.1.0"
description = "A terminal AI chat assistant prototype."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "textual>=6.6.0",
]

[project.scripts]
weizhcode = "weizhcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
